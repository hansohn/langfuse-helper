---
name: ci

on:
  workflow_dispatch:
  # Branch pushes are covered by pull_request; also running on every branch push
  # would test each PR commit twice.
  push:
    branches:
      - main
    tags:
      - 'v?[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          src: scripts

      - name: Makefile parses
        run: |
          make help > /dev/null
          make test/assert

      - name: trace/tag and trace/untag, for every harness
        env:
          # Harness config is resolved from $HOME, so point it somewhere scratch.
          HOME: ${{ runner.temp }}/home
        run: |
          repo="$RUNNER_TEMP/some-repo"
          settings="$repo/.claude/settings.json"
          mkdir -p "$HOME" "$repo/.claude"
          echo '{"model": "x", "env": {"CC_LANGFUSE_TRACE_TAGS": "team:sre"}}' > "$settings"

          make trace/tag "$repo" TRACE_HARNESSES="claude codex"
          make trace/tag "$repo" TRACE_HARNESSES="claude codex" | grep -c 'no change' | grep -qx 2
          jq -e '.model == "x" and .env.CC_LANGFUSE_TRACE_TAGS == "team:sre,repo:some-repo,harness:claude"' "$settings"
          jq -e '.tags == ["repo:some-repo", "harness:codex"]' "$repo/.codex/langfuse.json"
          grep -qx 'hooks = true' "$repo/.codex/config.toml"

          make trace/untag "$repo" TRACE_HARNESSES="claude codex"
          jq -e '.env.CC_LANGFUSE_TRACE_TAGS == "team:sre"' "$settings"
          [ ! -e "$repo/.codex" ]

      - name: A foreign Codex config.toml is refused, not rewritten
        run: |
          repo="$RUNNER_TEMP/foreign-repo"
          mkdir -p "$repo/.codex"
          printf '[features]\nhooks = false\n' > "$repo/.codex/config.toml"
          cp "$repo/.codex/config.toml" "$RUNNER_TEMP/before.toml"
          ! make trace/tag "$repo" TRACE_HARNESSES=codex
          cmp "$repo/.codex/config.toml" "$RUNNER_TEMP/before.toml"
          [ ! -e "$repo/.codex/langfuse.json" ]

  # Brings up the real stack and round-trips a backup through 'make clean', which
  # regenerates every secret. Restored API keys only authenticate if restore put
  # SALT back and the postgres load succeeded, so they are the assertion.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner has no git identity for the headless account to default to.
      HEADLESS_EMAIL: ci@example.com
      # Mint a key pair per harness. Neither CLI is on the runner, so
      # trace/install only warns; the keys are what this job checks.
      TRACE_HARNESSES: claude codex
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: dev/up with tracing
        # trace/project drives Langfuse's internal tRPC routes, so this is also the
        # early warning for upstream changing them.
        run: TRACE=true make dev/up

      - name: trace/project is idempotent
        run: make trace/project | grep -c 'already authenticate' | grep -qx 2

      - name: Back up
        run: |
          make langfuse/backup
          echo "BACKUP_DEST=$(ls -d "$PWD"/backups/*/ | tail -1)" >> "$GITHUB_ENV"

      - name: Clean and reprovision
        run: |
          make clean FORCE=true
          make dev/up

      - name: Restore
        run: make langfuse/restore FORCE=true

      - name: Verify restore
        run: |
          make langfuse/wait
          read_var() { grep -E "^$1=" "$BACKUP_DEST/env" | cut -d= -f2-; }

          # Every harness's keys from the backup authenticate against the rebuilt
          # stack, and all of them point at the one tracing project.
          for harness in CLAUDE CODEX; do
            curl --silent --show-error --fail \
              --user "$(read_var LANGFUSE_TRACE_${harness}_PUBLIC_KEY):$(read_var LANGFUSE_TRACE_${harness}_SECRET_KEY)" \
              http://localhost:3000/api/public/projects \
              | jq -e '.data[0].id == "claude-code-skills" and .data[0].name == "Coding Agents"'
          done

          # Materialized views detached for the load were reattached.
          ch_password="$(grep -E '^CLICKHOUSE_PASSWORD=' .env | cut -d= -f2-)"
          mvs="$(docker exec "$(docker ps -qf label=com.docker.compose.service=clickhouse)" \
            clickhouse-client --user clickhouse --password "$ch_password" \
            --query "SELECT count() FROM system.tables WHERE database = 'default' AND engine = 'MaterializedView'")"
          echo "materialized views attached: $mvs"
          [ "$mvs" -gt 0 ]

      - name: Logs on failure
        if: failure()
        run: make docker/logs FOLLOW=false TAIL=200

  slack:
    # Fork PRs get no secrets, so the webhook would fail there.
    if: >-
      always() && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - lint
      - smoke
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # The secrets context cannot appear in an 'if', but env can. Without a
    # webhook configured the step is skipped rather than failing the run.
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - name: Slack Notification
        if: env.SLACK_WEBHOOK != ''
        uses: Gamesight/slack-workflow-status@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          channel: ${{ secrets.SLACK_CHANNEL_ID }}
          name: ${{ secrets.SLACK_USERNAME }}
          icon_url: "https://cdn-icons-png.flaticon.com/512/25/25231.png"
