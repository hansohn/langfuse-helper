name: Support Request
description: Ask a question or get help using this project
title: "[Support]: "
labels: [support]
assignees:
  - hansohn

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this support request!

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false

  - type: textarea
    id: question
    attributes:
      label: How can we help you?
      description: Ask anything you can think of, we're here to help.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about your question here.
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/hansohn/langfuse-helper/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
